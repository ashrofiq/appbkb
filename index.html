button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;transition:.15s}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:#1a73e8;color:#fff}.btn:hover:not(:disabled){background:#155ab6}
.btn2{background:#e8eef7;color:#20303f}.btn2:hover:not(:disabled){background:#d7e2f1}
.btn3{background:#e74c3c;color:#fff}.btn3:hover{background:#c0392b}
.btn4{background:#27ae60;color:#fff}.btn4:hover{background:#1e8449}
.btn5{background:#f39c12;color:#fff}.btn5:hover{background:#d68910}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 11px;border:1px solid #cfd9e4;border-radius:8px;width:100%;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.12)}
textarea{resize:vertical;min-height:70px}
label{font-size:12px;font-weight:600;color:#5a6b7c;display:block;margin-bottom:5px}
.fg{margin-bottom:13px}
.row{display:grid;gap:12px}
.r2{grid-template-columns:1fr 1fr}.r3{grid-template-columns:1fr 1fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.r2,.r3,.r4{grid-template-columns:1fr}}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f4c81,#1a73e8 60%,#4facfe);z-index:1000;padding:20px}
.lcard{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:390px;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.lcard h1{font-size:19px;text-align:center;color:#0f4c81;margin-bottom:6px;line-height:1.3}
.lcard p{text-align:center;font-size:12px;color:#7b8a99;margin-bottom:22px}
.lcard .logo{width:96px;height:96px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;overflow:hidden;box-shadow:0 4px 14px rgba(26,115,232,.25);border:3px solid #e8f0fe}
.lcard .logo img{width:100%;height:100%;object-fit:cover;display:block}
.lcard .sub-title{text-align:center;font-size:13px;color:#0f4c81;font-weight:700;margin-top:2px;margin-bottom:4px;letter-spacing:.5px}
.lcard .sub-title2{text-align:center;font-size:12px;color:#5a6b7c;font-weight:600;margin-bottom:20px}
.err{background:#fdecea;color:#c0392b;padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}
.lhint{background:#e8f0fe;color:#0f4c81;padding:9px 12px;border-radius:8px;font-size:11.5px;margin-bottom:14px;line-height:1.5;border-left:3px solid #1a73e8}
#app{display:none;min-height:100vh}
.top{background:#0f4c81;color:#fff;padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
.top .who{font-size:12px;opacity:.9;display:flex;align-items:center;gap:10px}
.burger{display:none;background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;font-size:18px}
#themeBtn{background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;font-size:15px;border-radius:8px;line-height:1;min-width:34px;text-align:center}
#themeBtn:hover{background:rgba(255,255,255,.28)}

/* tombol zoom */
.zoomBtn{background:rgba(255,255,255,.15);color:#fff;padding:6px 9px;font-size:12.5px;font-weight:700;border-radius:8px;line-height:1;min-width:34px;text-align:center}
.zoomBtn:hover:not(:disabled){background:rgba(255,255,255,.28)}
.zoomBtn:disabled{opacity:.4;cursor:default}
body.dark .zoomBtn{background:rgba(255,255,255,.12)}
body.dark .zoomBtn:hover:not(:disabled){background:rgba(255,255,255,.22)}
/* sidebar: tombol Keluar di paling bawah */
.side{display:flex;flex-direction:column}
.side>*{flex-shrink:0}
.side-logout{padding:2px 12px 14px}
.side-logout button{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 10px;font-size:12.5px;font-weight:700;border:1px solid #f0c4be;background:#fdf1ef;color:#c0392b;border-radius:8px;cursor:pointer}
.side-logout button:hover{background:#fae0dc}
body.dark .side-logout button{background:#2a1c1c;border-color:#5a2f2c;color:#ff8f82}
body.dark .side-logout button:hover{background:#3a2323}
/* jendela input presensi: lebar & compact */
.modal.xwide{max-width:min(1240px,97vw)}
.modal.xwide .mb{max-height:calc(100vh - 175px);padding:14px 18px}
.kh-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:1000px){.kh-grid{grid-template-columns:1fr}}
.kh-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.kh-tbl{min-width:0;font-size:12px;border:1px solid #e3eaf2;border-radius:8px;overflow:hidden}
.kh-tbl th{padding:5px 7px;font-size:10.5px}
.kh-tbl td{padding:2px 7px;vertical-align:middle;line-height:1.2}
.kh-tbl .kh-no{width:30px;color:#8494a4}
.kh-tbl .kh-st{white-space:nowrap;width:128px}
.kh-tbl .kh-st label{display:inline-flex;align-items:center;gap:2px;margin:0 5px 0 0;font-weight:700;font-size:12px;text-transform:none;letter-spacing:0;cursor:pointer}
.kh-tbl .kh-st input{width:auto;margin:0;padding:0}
.kh-tbl .kh-H{color:#1e8449}.kh-tbl .kh-S{color:#d68910}.kh-tbl .kh-I{color:#1a73e8}.kh-tbl .kh-A{color:#c0392b}
.kh-tbl .ketIn{padding:2px 6px;font-size:11.5px;height:24px;min-width:0}
.kh-tbl tbody tr:nth-child(even){background:#fafcfe}
body.dark .kh-tbl{border-color:#243442}
body.dark .kh-tbl tbody tr:nth-child(even){background:#192533}
.xwide-note .notif{margin-bottom:8px;padding:7px 10px;font-size:12.5px}
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:206px;background:#fff;border-right:1px solid #dde5ee;padding:6px 0 10px;flex-shrink:0;overflow-y:auto;height:calc(100vh - 56px);position:sticky;top:56px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 13px;color:#3c4c5c;text-decoration:none;font-size:12.5px;font-weight:500;border-left:3px solid transparent;line-height:1.25}
.side a:hover{background:#f2f7fd}
.side a.on{background:#e8f0fe;color:#1a73e8;border-left-color:#1a73e8;font-weight:700}
.side a i{font-style:normal;font-size:14px;width:18px;text-align:center;flex-shrink:0}
.side .sec{font-size:9.5px;font-weight:700;color:#9aa9b8;letter-spacing:1px;padding:9px 13px 3px;text-transform:uppercase}
@media(max-width:900px){.burger{display:block}.side{position:fixed;left:-220px;top:56px;z-index:60;transition:.25s;box-shadow:4px 0 20px rgba(0,0,0,.12)}.side.open{left:0}}
.main{flex:1;padding:18px;overflow-x:hidden}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 4px rgba(16,42,67,.08);margin-bottom:16px}
.card h2{font-size:16px;color:#0f4c81;margin-bottom:3px}
.card .sub{font-size:12px;color:#8494a4;margin-bottom:15px}
.hd{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.hd h2{font-size:17px;color:#0f4c81}
.hd .sub{font-size:12px;color:#8494a4;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:#fff;padding:6px;border-radius:10px;box-shadow:0 1px 4px rgba(16,42,67,.08)}
.tabs .tab{padding:9px 15px;background:transparent;color:#5a6b7c;font-size:13px;font-weight:600;border-radius:8px;cursor:pointer;border:none;transition:.15s}
.tabs .tab.on{background:#1a73e8;color:#fff}
.tabs .tab:hover:not(.on){background:#e8eef7}
.tw{overflow-x:auto;border-radius:10px;border:1px solid #e3eaf2}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;min-width:560px}
th{background:#f5f8fc;color:#42566b;text-align:left;padding:10px 11px;font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #e3eaf2;white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid #eef3f8;vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafcff}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.tg{background:#e6f7ee;color:#1e8449}.tr{background:#fdecea;color:#c0392b}
.ty{background:#fff5e0;color:#b9770e}.tb{background:#e8f0fe;color:#1a73e8}
.tgray{background:#eef1f5;color:#68788a}
.empty{text-align:center;padding:34px;color:#9aa9b8;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(15,35,55,.55);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:26px 14px;overflow-y:auto}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:680px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.modal.wide{max-width:960px}
.mh{padding:16px 20px;border-bottom:1px solid #eef3f8;display:flex;justify-content:space-between;align-items:center}
.mh h3{font-size:15px;color:#0f4c81}
.mh .x{background:none;color:#8494a4;font-size:22px;line-height:1;padding:0 6px}
.mb{padding:20px;max-height:70vh;overflow-y:auto}
.mf{padding:14px 20px;border-top:1px solid #eef3f8;display:flex;justify-content:flex-end;gap:9px}
#toast{position:fixed;top:70px;right:16px;z-index:999;display:flex;flex-direction:column;gap:9px}
.tst{padding:12px 17px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tst.ok{background:#27ae60}.tst.er{background:#e74c3c}.tst.inf{background:#1a73e8}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:16px}
.sc{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(16,42,67,.08);border-left:4px solid #1a73e8}
.sc .n{font-size:26px;font-weight:800;color:#0f4c81}
.sc .l{font-size:11.5px;color:#8494a4;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.sc.g{border-left-color:#27ae60}.sc.r{border-left-color:#e74c3c}.sc.y{border-left-color:#f39c12}.sc.p{border-left-color:#8e44ad}
.sc.b{border-left-color:#2980b9}.sc.pk{border-left-color:#e84393}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;background:#f7fafd;padding:13px;border-radius:10px;border:1px solid #e8eff7}
.fbar .fg{margin:0;min-width:130px;flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e8f0fe;color:#1a73e8;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;margin:3px 4px 3px 0}
.chip b{background:#1a73e8;color:#fff;border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer}
.pick{display:flex;gap:8px;align-items:center}
.pick select{flex:1}
canvas.sig{border:1px dashed #b9c8d8;border-radius:8px;background:#fbfdff;width:100%;height:130px;touch-action:none;display:block}
.hint{font-size:11px;color:#8494a4;margin-top:4px}
.kop{max-width:100%;max-height:110px;border:1px solid #e3eaf2;border-radius:8px;background:#fbfdff;padding:5px}
.right{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.small{font-size:11px;color:#8494a4}
.reko{font-size:11.5px;color:#7a4a00;background:#fff5e0;padding:4px 8px;border-radius:6px;display:inline-block}
.notif{padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:12.5px;line-height:1.5}
.notif.edit{background:#fff5e0;border-left:4px solid #f39c12;color:#7a4a00}
.notif.new{background:#e6f7ee;border-left:4px solid #27ae60;color:#1e8449}
.notif.info{background:#e8f0fe;border-left:4px solid #1a73e8;color:#0f4c81}
.notif.err{background:#fdecea;border-left:4px solid #e74c3c;color:#c0392b}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gc{background:#f7fafd;border:1px solid #e8eff7;border-radius:10px;padding:14px}
.gc .lbl{font-size:11px;color:#8494a4;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.gc .val{font-size:22px;font-weight:800;color:#0f4c81;margin-top:4px}
.kelas-group{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(16,42,67,.08)}
.kelas-group h3{font-size:14px;color:#0f4c81;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eef3f8;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.kelas-group h3 .total{font-size:12px;color:#5a6b7c;font-weight:600}
.preview-list{max-height:220px;overflow-y:auto;border:1px solid #e3eaf2;border-radius:8px;padding:10px 14px;background:#fbfdff;font-size:12px}
.preview-list ul{margin:0;padding-left:18px}
.preview-list li{margin:4px 0;line-height:1.5}
.mslist{max-height:280px;overflow-y:auto;border:1px solid #e3eaf2;border-radius:8px;padding:10px;background:#fbfdff}
.mslist label{display:inline-flex;align-items:center;gap:6px;margin:0 14px 6px 0;font-weight:500;font-size:12.5px}
.mslist label input{width:auto}
.tier{display:inline-block;padding:5px 14px;border-radius:6px;font-size:11.5px;font-weight:700;margin-right:6px;letter-spacing:.3px;white-space:nowrap}
.tier-1{background:#e6f7ee;color:#1e8449}.tier-2{background:#e8f0fe;color:#1a73e8}
.tier-3{background:#fff5e0;color:#b9770e}.tier-4{background:#fdecea;color:#c0392b}
.tier-range{font-weight:600;opacity:.8;margin-left:2px}
.lp-btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lp-btn{padding:12px;background:#f7fafd;border:1px solid #e8eff7;border-radius:10px;text-align:left;font-size:13px;font-weight:600;color:#20303f;cursor:pointer;transition:.15s}
.lp-btn:hover{background:#e8f0fe;border-color:#1a73e8;color:#1a73e8}
.lp-btn.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.lp-btn small{display:block;font-size:10.5px;font-weight:500;color:#8494a4;margin-top:2px}
.lp-btn.on small{color:rgba(255,255,255,.75)}
tr.rawan-t1 td{color:#1e8449}tr.rawan-t2 td{color:#b9770e;font-weight:600}
tr.rawan-t3 td{color:#d35400;font-weight:700}tr.rawan-t4 td{color:#c0392b;font-weight:800;background:#fff5f5}
tr.rawan-t1 .tag,tr.rawan-t2 .tag,tr.rawan-t3 .tag,tr.rawan-t4 .tag{color:inherit}
tr.rawan-t1 .tag{background:#e6f7ee;color:#1e8449}
tr.rawan-t2 .tag{background:#fff5e0;color:#b9770e}
tr.rawan-t3 .tag{background:#ffe9d6;color:#d35400}
tr.rawan-t4 .tag{background:#fdecea;color:#c0392b}
.rawan-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12px}
.rawan-legend span{display:inline-flex;align-items:center;gap:6px}
.rawan-legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot-t1{background:#1e8449}.dot-t2{background:#b9770e}.dot-t3{background:#d35400}.dot-t4{background:#c0392b}
.makalah-wrapper{background:#dfe6ef;padding:20px;border-radius:10px;max-height:75vh;overflow-y:auto;margin-top:12px}
.makalah{background:#fff;max-width:820px;margin:0 auto;padding:50px 60px;box-shadow:0 4px 20px rgba(0,0,0,.18);font-family:'Times New Roman',Georgia,serif;font-size:13.5px;line-height:1.7;color:#111}
.makalah .cover-page{text-align:center;padding-top:30px;padding-bottom:30px;border-bottom:1px dashed #cbd5e1;margin-bottom:30px}
.makalah .cover-page .cover-logo{text-align:center;margin-bottom:14px}
.makalah .cover-page .cover-logo img{max-height:130px;max-width:130px;object-fit:contain}
.makalah .cover-page h1{font-size:20px;font-weight:bold;text-transform:uppercase;margin:36px 0;line-height:1.4;letter-spacing:.5px;text-align:center}
.makalah .cover-page .cover-periode{font-size:14px;font-weight:600;margin-bottom:36px;text-align:center}
.makalah .cover-page .cover-disusun{margin-top:60px;font-size:14px;text-align:center}
.makalah .cover-page .cover-disusun p{text-align:center}
.makalah .cover-page .cover-identitas{font-size:15px;font-weight:bold;margin-top:60px;text-align:center}
.makalah .cover-page .cover-identitas p{text-align:center}
.makalah h2{font-size:15px;font-weight:bold;text-align:center;text-transform:uppercase;margin:26px 0 14px;letter-spacing:.5px;padding-bottom:6px;border-bottom:2px solid #0f4c81;color:#0f4c81}
.makalah h2.bab-title{text-align:center;border:none;background:transparent;padding:14px 0;margin:30px 0 18px;color:#0f4c81}
.makalah h3{font-size:13.5px;font-weight:bold;margin:18px 0 8px;color:#111}
.makalah p{text-align:justify;margin-bottom:9px;text-indent:0}
.makalah ol,.makalah ul{margin:8px 0 12px 24px}
.makalah ol li,.makalah ul li{margin-bottom:5px;text-align:justify}
.makalah table.rp{width:100%;border-collapse:collapse;font-size:11.5px;margin:10px 0 16px}
.makalah table.rp th,.makalah table.rp td{border:1px solid #333;padding:5px 7px;vertical-align:top;text-align:left}
.makalah table.rp th{background:#e8eef7;font-weight:bold;text-align:center}
.makalah .ttd-blok{margin-top:34px;text-align:right;padding-right:20px;line-height:1.8}
.makalah .page-break{margin-top:34px;padding-top:20px;border-top:1px dashed #cbd5e1}
.badge-online{display:inline-flex;align-items:center;gap:4px;background:#e8f0fe;color:#1a73e8;padding:3px 9px;border-radius:12px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.gdrive-box{background:#f7fafd;padding:14px;border-radius:10px;border:1px solid #e8eff7;margin-top:10px;font-size:12px;line-height:1.7}
.gdrive-box ol{margin-left:20px;margin-top:6px}
.gdrive-box code{background:#eef2f7;padding:2px 6px;border-radius:4px;font-family:monospace;font-size:11px}
.nav-harian{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;background:#f7fafd;padding:12px;border-radius:10px;border:1px solid #e8eff7}
.nav-harian .tanggal{text-align:center;flex:1;min-width:220px}
.nav-harian .tanggal .hari{font-size:16px;font-weight:700;color:#0f4c81}
.nav-harian .tanggal .ket{font-size:11.5px;color:#8494a4;margin-top:3px}
.gd-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#f7fafd;border:1px solid #e8eff7;border-radius:8px;margin-bottom:8px;flex-wrap:wrap}
.gd-item .info{flex:1;min-width:200px;font-size:12.5px}
.gd-item .info b{color:#0f4c81}
.gd-item .info .meta{font-size:11px;color:#8494a4;margin-top:2px}
.acc-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#e6f7ee;color:#1e8449;border-radius:20px;font-size:11.5px;font-weight:700}
.jurnal-card{background:#f7fafd;border:1px solid #e8eff7;border-radius:10px;padding:14px;margin-bottom:10px}
.jurnal-card .jhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.jurnal-card .jdate{font-size:12px;font-weight:700;color:#0f4c81}
.jurnal-card .jbody{font-size:12.5px;line-height:1.6}
.jurnal-card .jmeta{font-size:11px;color:#8494a4;margin-top:6px}
.jurnal-auto{background:#e6f7ee;border-left:4px solid #27ae60;padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:12.5px}

function pkOf(sheet){
  if(sheet === SH.KELAS)   return 'nama';
  if(sheet === SH.SISWA)   return 'nis';
  if(sheet === SH.SETTING) return 'key';
  return 'id';
}
function idOf(sheet, obj){
  obj = obj || {};
  if(sheet === SH.KELAS)   return String(obj.Nama || obj.nama || obj.ID || uid());
  if(sheet === SH.SISWA){
    var v = (obj.NIS !== undefined && obj.NIS !== null) ? obj.NIS : (obj.nis !== undefined && obj.nis !== null ? obj.nis : '');
    return String(v);
  }
  if(sheet === SH.SETTING) return String(obj.Key || obj.key || '');
  return obj.ID || uid();
}
function toRow(sheet, obj){
  var map = FIELD_MAP[sheet];
  var row = {};
  if(!map) return row;
  Object.keys(map).forEach(function(k){
    if(Object.prototype.hasOwnProperty.call(obj, k) && obj[k] !== undefined) row[map[k]] = obj[k];
  });
  return row;
}
function fromRow(sheet, row){
  if(!row) return null;
  var map = FIELD_MAP[sheet];
  if(!map){
    if(sheet === SH.SETTING) return { Key: row.key, Value: row.value };
    return Object.assign({}, row);
  }
  var obj = {};
  Object.keys(map).forEach(function(k){
    var col = map[k];
    if(row[col] !== undefined && row[col] !== null) obj[k] = row[col];
  });
  if(sheet === SH.KELAS){ obj.Nama = row.nama; obj.ID = row.nama; }
  if(sheet === SH.SETTING){ obj.Key = row.key; obj.Value = row.value; }
  return obj;
}

var _sbClient = null;
function sbClient(){
  if(!_sbClient){
    if(!window.supabase || !window.supabase.createClient){
      throw new Error('Supabase JS belum dimuat. Cek koneksi internet.');
    }
    _sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  }
  return _sbClient;
}

function pesanErrorDatabase(e, konteks){
  var msg = String((e && (e.message || e.details || e.hint)) || e || 'Kesalahan tidak diketahui');
  var code = String((e && e.code) || '');
  if(code === '42501' || /row-level security|permission denied|not allowed/i.test(msg)){
    return 'Akses database ditolak oleh kebijakan/izin Supabase. Periksa RLS Policy untuk tabel yang digunakan. ('+msg+')';
  }
  if(code === '42P01' || code === 'PGRST205' || /could not find the table|relation .* does not exist|table .* not found/i.test(msg)){
    return 'Tabel database tidak ditemukan atau belum masuk schema cache Supabase. Periksa nama tabel: '+(konteks||'')+'. ('+msg+')';
  }
  if(code === '42703' || code === 'PGRST204' || /column .* does not exist|could not find the .* column/i.test(msg)){
    return 'Nama kolom database tidak cocok dengan script pada tabel '+(konteks||'')+'. ('+msg+')';
  }
  if(/fetch|failed to fetch|networkerror|load failed/i.test(msg)){
    return 'Gagal terhubung ke Supabase. Periksa internet, URL project, dan anon key. ('+msg+')';
  }
  if(code === '23505') return 'Data duplikat: nilai kunci utama/unik sudah digunakan. ('+msg+')';
  if(code === '22P02') return 'Format data tidak sesuai tipe kolom database (misalnya ID UUID atau tanggal). ('+msg+')';
  return msg;
}

}
async function api(action, payload){
  payload = payload || {};

    var result = await _apiImpl(action, payload);
    invalidasiCacheSetelahTulis(action, payload);

  }
}

async function fetchAllRowsPaginated(sb, table, opts){
  opts = opts || {};
  var pageSize = 1000;
  var from = 0;
  var allRows = [];
  while(true){
    var q = sb.from(table).select('*').range(from, from + pageSize - 1);
    if(opts.since) q = q.gte('tanggal', opts.since);
    if(opts.until) q = q.lte('tanggal', opts.until);
    if(opts.orderBy) q = q.order(opts.orderBy, { ascending: opts.asc !== false });
    var r = await q;
    if(r.error) throw r.error;
    var rows = r.data || [];
    allRows = allRows.concat(rows);
    if(rows.length < pageSize) break;
    from += pageSize;
  }
  return allRows;
}

async function _apiImpl(action, payload){
  var sb = sbClient();
  switch(action){

    case 'login': {
      var username = String(payload.username||'').trim().toLowerCase();
      var password = String(payload.password||'');
      var r = await sb.from('bk_users').select('*').eq('username', username).eq('password', password).maybeSingle();
      if(r.error) throw r.error;
      if(!r.data){
        var rs = await sb.from('bk_siswa').select('*').ilike('nama', username + '%');
        if(rs.error) throw rs.error;
        var siswaMatch = (rs.data || []).find(function(row){
          var namaLengkap = String(row.nama || '').trim();
          var namaDepan = (namaLengkap.split(/\s+/)[0] || '').toLowerCase();
          var tanggalLahir = String(row.tanggal_lahir || '').slice(0, 10);
          return namaDepan === username && tanggalLahir === password.trim();
        });
        if(siswaMatch){
          var siswaObj = fromRow(SH.SISWA, siswaMatch);
          return { token:'sb_'+uid(), role:'siswa', username: String(siswaMatch.nis || username),
                   siswa: siswaObj, guru_id:null, guru:null,
                   expiresAt: Date.now() + 30*24*60*60*1000 };
        }
        throw new Error('Login siswa gagal. Periksa nama depan dan tanggal lahir dengan format YYYY-MM-DD.');
      }
      var u = r.data, guru = null;
      if(u.role === 'gurubk' && u.guru_id){
        var g = await sb.from('bk_gurubk').select('*').eq('id', u.guru_id).maybeSingle();
        if(g.error) throw g.error;
        if(g.data) guru = fromRow(SH.GURUBK, g.data);
      } else if(u.role === 'gurupiket' && u.guru_id){
        var gp = await sb.from('bk_gurupiket').select('*').eq('id', u.guru_id).maybeSingle();
        if(gp.error) throw gp.error;
        if(gp.data) guru = fromRow(SH.GURUPIKET, gp.data);
      }
      return { token:'sb_'+uid(), role:u.role, username:u.username, guru_id:u.guru_id||null, guru:guru,
               expiresAt: Date.now() + 30*24*60*60*1000 };
    }
    case 'logout': return { ok:true };

    case 'refreshMyGuru': {
      if(!ST.user || !ST.user.guru_id) return null;
      if(ST.user.role === 'siswa') return null;
      var tblR = (ST.user.role === 'gurupiket') ? 'bk_gurupiket' : 'bk_gurubk';
      var shR  = (ST.user.role === 'gurupiket') ? SH.GURUPIKET : SH.GURUBK;
      var g2 = await sb.from(tblR).select('*').eq('id', ST.user.guru_id).maybeSingle();
      if(g2.error) throw g2.error;
      return g2.data ? fromRow(shR, g2.data) : null;
    }

    case 'getMySiswa': {
      if(!ST.user || ST.user.role !== 'siswa') return null;
      var nisMe = String(ST.user.username||'');
      if(!nisMe) return null;
      var rMy = await sb.from('bk_siswa').select('*').eq('nis', nisMe).maybeSingle();
      if(rMy.error) throw rMy.error;
      return rMy.data ? fromRow(SH.SISWA, rMy.data) : null;
    }

    case 'saveKontakSiswa': {
      if(!ST.user || ST.user.role !== 'siswa') throw new Error('Hanya siswa yang dapat menyimpan data ini');
      var lockCheck = await sb.from('bk_kontrol_siswa').select('input_terkunci').eq('id',1).maybeSingle();
      if(lockCheck.error) throw lockCheck.error;
      if(lockCheck.data && lockCheck.data.input_terkunci) throw new Error('Input data siswa sedang dikunci oleh Administrator. Anda hanya dapat melihat data.');
      var nisKS = String(payload.NIS||'').trim();
      if(!nisKS) throw new Error('NIS tidak valid');
      if(String(ST.user.username) !== nisKS) throw new Error('Akses ditolak');
      var recKS = {};
      if(payload.NoHP !== undefined){ recKS.no_hp = formatPhoneForDB(payload.NoHP); recKS.wa_status_siswa = null; }
      if(payload.NamaAyah !== undefined) recKS.nama_ayah  = String(payload.NamaAyah||'').trim();
      if(payload.NoHPAyah !== undefined){ recKS.no_hp_ayah = formatPhoneForDB(payload.NoHPAyah); recKS.wa_status_ayah = null; }
      if(payload.NamaIbu !== undefined)  recKS.nama_ibu   = String(payload.NamaIbu||'').trim();

      if(rKS.error) throw rKS.error;
      var curKS = await sb.from('bk_siswa').select('*').eq('nis', nisKS).maybeSingle();
      if(curKS.error) throw curKS.error;
      return { ok:true, siswa: curKS.data ? fromRow(SH.SISWA, curKS.data) : null };

    case 'changeAdminPassword': {
      var oldPw = String(payload.oldPassword||'');

      if(!newPw || newPw.length < 4) throw new Error('Password baru minimal 4 karakter');
      var cur = await sb.from('bk_users').select('*').eq('username','admin').maybeSingle();
      if(cur.error) throw cur.error;

    case 'bootstrap': {

function colDef(k,l,kind){
  var c={k:k,l:l};
  if(kind==='date') c.f=function(v){ return esc(v ? tgl(v) : '-'); };
  else if(kind==='ksiswa'){ c.v=function(r){ var x=klasikalStat(r); return x.siswa==null?'':x.siswa; }; c.f=function(v,r){ var x=klasikalStat(r); return x.siswa==null?'-':String(x.siswa); }; }
  else if(kind==='kmasuk'){ c.v=function(r){ var x=klasikalStat(r); return x.masuk==null?'':x.masuk; }; c.f=function(v,r){ var x=klasikalStat(r); return x.masuk==null?'-':'<b style="color:#1e8449">'+x.masuk+'</b>'+(x.auto?'':' <span class="small">(manual)</span>'); }; }
  else if(kind==='ktidak'){ c.v=function(r){ var x=klasikalStat(r); return x.tidak==null?'':x.tidak; }; c.f=function(v,r){ var x=klasikalStat(r); if(x.tidak==null) return '-'; return '<b style="color:#c0392b">'+x.tidak+'</b>'+(x.auto&&x.tidak?' <span class="small">(S:'+x.S+' I:'+x.I+' A:'+x.A+')</span>':'')+(x.auto?'':' <span class="small">(manual)</span>'); }; }
  else if(kind==='ktidaknama') c.f=function(v,r){ return klasikalTidakMasukHTML(r); };
  else if(kind==='anggota') c.f=function(v){ var a=formatAnggotaKelompok(v); return esc(a.length ? a.join(', ') : (v||'-')); };
  else if(kind==='text') c.f=function(v){ return esc(v==null || v==='' ? '-' : String(v)); };
  return c;
}

function studentOptions(selected, kelas){
  var source = siswaSaya();
  if(!source || !source.length) source = (ST.user && ST.user.role==='admin') ? (ST.siswa||[]) : source;
  if(kelas) source = source.filter(function(s){ return String(s.Kelas)===String(kelas); });
  var seen = {};
  var out = '<option value="">-- Pilih Siswa --</option>';
  source.slice().sort(function(a,b){ return String(a.Nama||'').localeCompare(String(b.Nama||''),'id'); }).forEach(function(s){
    var nis=String(s.NIS||''); if(!nis || seen[nis]) return; seen[nis]=1;
    out += '<option value="'+esc(nis)+'"'+(String(selected||'')===nis?' selected':'')+'>'+esc(s.Nama||nis)+' ('+esc(nis)+')</option>';
  });
  if(selected && !seen[String(selected)]){
    var any=(ST.siswa||[]).find(function(s){return String(s.NIS)===String(selected);});
    if(any) out += '<option value="'+esc(any.NIS)+'" selected>'+esc(any.Nama||any.NIS)+' ('+esc(any.NIS)+')</option>';
  }
  return out;
}
function buildForm(key, data){

  var html='<div class="row r2" style="row-gap:4px">';
  schema.forEach(function(f){
    var value=data[f.k];
    if(value===undefined || value===null){
      if(f.k==='Petugas') value=currentPetugasName();
      else if(f.t==='date') value=today();
      else if(f.t==='time' && f.req) value=nowTime();
      else if(f.def!==undefined) value=f.def;
      else value='';
    }
    if(f.t==='hidden'){
      html += '<input type="hidden" id="f_'+f.k+'" value="'+esc(value)+'">';
      return;
    }
    var req=f.req?' <span style="color:#e74c3c">*</span>':'';
    var wide=f.full || ['textarea','multisiswa','sig'].indexOf(f.t)>=0;
    var wrap='<div class="fg"'+(wide?' style="grid-column:1/-1"':'')+'><label for="f_'+f.k+'">'+esc(f.l)+req+'</label>';
    if(f.t==='kelas'){
      var ks=kelasSaya().slice();
      if(value && ks.indexOf(String(value))<0) ks.push(String(value));
      wrap+='<select id="f_'+f.k+'" '+(f.req?'required':'')+' onchange="onKelasChange(this.value)"><option value="">-- '+(f.req?'Pilih':'Semua')+' Kelas --</option>'+ks.sort(function(a,b){return String(a).localeCompare(String(b),'id');}).map(function(k){return '<option value="'+esc(k)+'"'+(String(value)===String(k)?' selected':'')+'>'+esc(k)+'</option>';}).join('')+'</select>';
    } else if(f.t==='student'){
      wrap+='<select id="f_'+f.k+'" '+(f.req?'required':'')+'>'+studentOptions(value, data.Kelas||'')+'</select>';
    } else if(f.t==='select'){
      var _opts=(f.options||[]).slice();
      if(value && !_opts.some(function(o){ return String(Array.isArray(o)?o[0]:o.v)===String(value); })) _opts.push([String(value),String(value)]);
      wrap+='<select id="f_'+f.k+'" '+(f.req?'required':'')+'><option value="">-- Pilih --</option>'+_opts.map(function(o){ var ov=Array.isArray(o)?o[0]:o.v; var ol=Array.isArray(o)?o[1]:o.l; return '<option value="'+esc(ov)+'"'+(String(value)===String(ov)?' selected':'')+'>'+esc(ol)+'</option>'; }).join('')+'</select>';
    } else if(f.t==='textarea'){
      wrap+='<textarea id="f_'+f.k+'" rows="3" '+(f.req?'required':'')+' placeholder="'+esc(f.placeholder||'')+'">'+esc(value)+'</textarea>';

    } else if(f.t==='multisiswa'){

        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px"><span id="multiShown_'+f.k+'" class="small"></span><button type="button" class="btn2 btn-sm" onclick="multiSelectShown(\''+f.k+'\')">Centang semua yang tampil</button></div>'+

        '<div id="multiSel_'+f.k+'" class="mslist" style="max-height:170px;background:#f7fbf8"></div>';
    } else {
      var type=f.t==='date'?'date':f.t==='time'?'time':f.t==='number'?'number':'text';
      wrap+='<input id="f_'+f.k+'" type="'+type+'" value="'+esc(value)+'" '+(f.req?'required':'')+(f.placeholder?' placeholder="'+esc(f.placeholder)+'"':'')+(f.t==='number'?' min="0" step="1"':'')+'>';
    }

  });

function parseAnggotaSelected(value){
  var out={};
  String(value||'').split(';').map(function(x){return x.trim();}).filter(Boolean).forEach(function(x){
    var i=x.indexOf(' - '); var nis=(i>0?x.slice(0,i):x).trim(); if(nis) out[nis]=x;
  });
  return out;
}
function multiSyncHidden(field, current){
  var hidden=document.getElementById('f_'+field); if(!hidden) return;
  hidden.value=Object.keys(current).map(function(n){return current[n];}).join('; ');
  var count=document.getElementById('multiCount_'+field);
  if(count) count.textContent=Object.keys(current).length+' siswa dipilih.';
  renderMultiSelected(field);
}
function collectMultiSiswa(field){
  var hidden=document.getElementById('f_'+field); if(!hidden) return;
  var current=parseAnggotaSelected(hidden.value);
  var boxes=Array.prototype.slice.call(document.querySelectorAll('[data-multi-field="'+field+'"]'));
  boxes.forEach(function(box){
    var nis=String(box.value||'');
    if(box.checked){ current[nis]=box.getAttribute('data-anggota')||nis; }
    else { delete current[nis]; }
  });
  multiSyncHidden(field, current);
}
function multiRemove(field, nis){
  var hidden=document.getElementById('f_'+field); if(!hidden) return;
  var current=parseAnggotaSelected(hidden.value);
  delete current[nis];
  multiSyncHidden(field, current);
  Array.prototype.slice.call(document.querySelectorAll('[data-multi-field="'+field+'"]')).forEach(function(box){ if(String(box.value)===String(nis)) box.checked=false; });
}
function multiClearAll(field){
  multiSyncHidden(field, {});
  Array.prototype.slice.call(document.querySelectorAll('[data-multi-field="'+field+'"]')).forEach(function(box){ box.checked=false; });
}
function multiSelectShown(field){
  var hidden=document.getElementById('f_'+field); if(!hidden) return;
  var current=parseAnggotaSelected(hidden.value);
  Array.prototype.slice.call(document.querySelectorAll('[data-multi-field="'+field+'"]')).forEach(function(box){
    box.checked=true; current[String(box.value)]=box.getAttribute('data-anggota')||String(box.value);
  });
  multiSyncHidden(field, current);
}
function renderMultiSelected(field){
  var el=document.getElementById('multiSel_'+field), hidden=document.getElementById('f_'+field); if(!el||!hidden) return;
  var cur=parseAnggotaSelected(hidden.value); var keys=Object.keys(cur);
  if(!keys.length){ el.innerHTML='<div class="small" style="color:#7a8896">Belum ada siswa yang dipilih.</div>'; return; }
  var mp={}; (ST.siswa||[]).forEach(function(x){ mp[String(x.NIS)]=x; });
  el.innerHTML=keys.map(function(nis){
    var x=mp[nis]; var nama=x?x.Nama:(cur[nis].indexOf(' - ')>0?cur[nis].slice(cur[nis].indexOf(' - ')+3):cur[nis]);
    return '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px"><input type="checkbox" checked style="width:auto" onchange="multiRemove(\''+field+'\',\''+esc(nis)+'\')"> <span style="flex:1">'+esc(nama)+' <span class="small">('+esc(x&&x.NIS?x.NIS:nis)+(x&&x.Kelas?', '+esc(x.Kelas):'')+')</span></span></div>';
  }).join('');
}
function updateMultiSiswa(field){
  var el=document.getElementById('multi_'+field), hidden=document.getElementById('f_'+field); if(!el||!hidden) return;
  var selected=parseAnggotaSelected(hidden.value);
  var qEl=document.getElementById('multiQ_'+field);
  var q=qEl?String(qEl.value||'').trim().toLowerCase():'';
  /* Peserta dipilih dari SEMUA siswa di semua kelas (Guru BK bebas memilih siapa pun) */
  var students=(ST.siswa||[]).slice();
  if(q){
    students=students.filter(function(s){
      return (String(s.Nama||'')+' '+String(s.NIS||'')+' '+String(s.Kelas||'')).toLowerCase().indexOf(q)>=0;
    });
  }
  students.sort(function(a,b){return String(a.Nama||'').localeCompare(String(b.Nama||''),'id');});
  if(!students.length){ el.innerHTML='<div class="empty">'+(q?'Tidak ada siswa yang cocok dengan pencarian.':'Belum ada data siswa.')+'</div>'; }
  else {
    el.innerHTML=students.map(function(s){

function initSigPads(){

      var w=Math.max(240,Math.floor(rect.width||canvas.clientWidth||500)); var h=130;

      var hidden=document.getElementById('f_'+key); var src=hidden&&hidden.value;

    canvas.addEventListener('pointermove',function(ev){ if(!drawing)return; var p=point(ev); ctx.lineTo(p.x,p.y); ctx.stroke(); moved=true; ev.preventDefault(); });
    function endDraw(){ if(!drawing)return; drawing=false; if(moved){var hidden=document.getElementById('f_'+key);if(hidden) hidden.value=canvas.toDataURL('image/png');} }

/* Jeda antar pesan WhatsApp: minimal 10 detik + acak (hingga +40%) + istirahat panjang tiap 15 pesan agar pola kirim tidak seragam */
var WA_BATCH_SIZE = 15, WA_BATCH_REST_MIN = 30000, WA_BATCH_REST_MAX = 60000;
function waJedaMs(i, baseMs){
  var ms = baseMs * (1 + Math.random() * 0.4);   /* 10–14 detik bila dasar 10 detik */
  if((i + 1) % WA_BATCH_SIZE === 0) ms += WA_BATCH_REST_MIN + Math.random() * (WA_BATCH_REST_MAX - WA_BATCH_REST_MIN);

function waGetLog(){
  try{
    var raw = localStorage.getItem('bk_wa_log');
    if(!raw) return {};
    var obj = JSON.parse(raw);
    if(!obj || typeof obj !== 'object') return {};
    return obj;
  }catch(e){ return {}; }
}
function waSaveLog(log){
  try{ localStorage.setItem('bk_wa_log', JSON.stringify(log)); }catch(e){}
}
function waLogKey(tanggal, nis, target, kategori){
  kategori = kategori || 'presensi';
  if(kategori === 'presensi') return tanggal + '||' + String(nis) + '||' + target;
  return kategori.toUpperCase() + '||' + tanggal + '||' + String(nis) + '||' + target;
}
function waWasSent(tanggal, nis, target, currentStatus, kategori){
  var log = waGetLog();
  var entry = log[waLogKey(tanggal, nis, target, kategori)];
  if(!entry) return { sent: false };
  if(currentStatus && entry.status && entry.status !== currentStatus){
    return { sent: false, statusChanged: true, oldStatus: entry.status };
  }
  return { sent: true, entry: entry };
}
function waMarkSent(tanggal, nis, target, status, phone, extra, kategori){
  var log = waGetLog();
  log[waLogKey(tanggal, nis, target, kategori)] = Object.assign({
    ts: Date.now(),
    tanggal: tanggal,
    nis: String(nis),
    target: target,
    status: status || '',
    phone: phone || '',
    kategori: kategori || 'presensi'
  }, extra || {});
  waSaveLog(log);
}
function waGetLogForDate(tanggal){
  var log = waGetLog();
  var out = [];
  Object.keys(log).forEach(function(k){
    var kat = 'presensi';
    var tgl = '';
    var nis = '';
    var tgt = '';
    if(k.indexOf('TERLAMBAT||') === 0){
      var parts = k.split('||');
      kat = 'terlambat'; tgl = parts[1]; nis = parts[2]; tgt = parts[3];
    } else {
      var parts2 = k.split('||');
      kat = 'presensi'; tgl = parts2[0]; nis = parts2[1]; tgt = parts2[2];
    }
    if(tgl === tanggal){
      out.push(Object.assign({ nis: nis, target: tgt, kategori: kat }, log[k]));
    }
  });
  return out;
}
function waGetLogDates(){
  var log = waGetLog();
  var dates = {};
  Object.keys(log).forEach(function(k){
    var tgl = '';
    if(k.indexOf('TERLAMBAT||') === 0){ tgl = k.split('||')[1]; }
    else { tgl = k.split('||')[0]; }
    if(!tgl) return;
    if(!dates[tgl]) dates[tgl] = { tanggal: tgl, total: 0, presensi: 0, terlambat: 0 };
    dates[tgl].total++;
    if(k.indexOf('TERLAMBAT||') === 0) dates[tgl].terlambat++;
    else dates[tgl].presensi++;
  });
  return Object.keys(dates).sort().reverse().map(function(d){ return dates[d]; });
}
function waClearLogForDate(tanggal){

    var cocok = false;
    if(k.indexOf('TERLAMBAT||') === 0){ cocok = (k.split('||')[1] === tanggal); }
    else { cocok = (k.indexOf(tanggal + '||') === 0); }
    if(cocok){ delete log[k]; removed++; }
  });
  waSaveLog(log);

}

        var errTxt = await res.text();
        result.failed++;
        result.details.push({ ok:false, nis:m.nis, target:m.target, error:errTxt });
      }
    }catch(e){
      result.failed++;
      result.details.push({ ok:false, nis:m.nis, target:m.target, error:e.message });
    }
    if(result.sent > _s0){ waHariTambah(); _gb = 0; }
    else {
      _gb++;
      if(_gb >= waAturan().maxGagal){
        result.dihentikan = true;
        result.error = 'Pengiriman dihentikan otomatis karena ' + _gb + ' pesan gagal beruntun. Periksa gateway WhatsApp.';
        break;
      }
    }
    if(options.onProgress) options.onProgress(i+1, messages.length);
    if(i < messages.length-1) await new Promise(function(r){ setTimeout(r, waJedaMs(i, delayMs)); });
  }
  return result;
}

async function kirimNotifikasiWATerlambat(rows, options){
  options = options || {};
  var gatewayUrl = getWAGatewayUrl();
  if(!gatewayUrl){
    if(!options.silent) toast('URL Gateway WhatsApp belum diatur di Setting','er');
    return { sent:0, failed:0, skipped:0 };
  }
  var targets = (rows||[]).filter(function(r){ return String(r.Tanggal||'').trim(); });
  if(!targets.length){
    if(!options.silent) toast('Tidak ada data keterlambatan untuk dikirim WA','inf');
    return { sent:0, failed:0, skipped:0, noTarget:true };
  }
  var tpl = (ST.setting && ST.setting.waTemplateTerlambat) || defaultWaTemplateTerlambat();
  var siswaMap = {};
  (ST.siswa||[]).forEach(function(s){ siswaMap[String(s.NIS)] = s; });
  var allMessages = [];
  targets.forEach(function(r){
    var s = siswaMap[String(r.NIS)];
    if(!s) return;
    var tglTxt = tglPanjang(r.Tanggal);
    var jamDatang = String(r.JamDatang||'').trim() || '-';
    var alasan = String(r.Alasan||'').trim() || 'tidak dicantumkan';
    var base = {
      '{nama}': r.Nama || s.Nama || '',
      '{nis}': r.NIS || s.NIS || '',
      '{kelas}': r.Kelas || s.Kelas || '',
      '{tanggal}': tglTxt,
      '{jam}': jamDatang,
      '{jam_datang}': jamDatang,
      '{alasan}': alasan,
      '{status}': 'Terlambat',
      '{petugas}': r.Petugas || '-'
    };
    var pu = waNomorOrtuUtama(s);
    if(pu){
      var vU = Object.assign({}, base, { '{ortu}': (pu.target==='ayah' ? 'Ayah ' + (s.NamaAyah || '') : 'Ibu ' + (s.NamaIbu || '')) });
      allMessages.push({ to:pu.phone, nis:r.NIS, target:pu.target, status:'Terlambat',
        nama:r.Nama||s.Nama||'', tanggal:r.Tanggal, message: renderTemplateWA(tpl, vU) });
    }
  });
  if(!allMessages.length){
    if(!options.silent) toast('Tidak ada nomor orang tua yang terisi','inf');
    return { sent:0, failed:0, skipped:targets.length, noPhone:true };
  }
  var skipDup = options.skipDuplicates !== false;
  var alreadySent = 0, forceResend = !!options.forceResend;
  var messages = [];
  allMessages.forEach(function(m){
    if(skipDup && !forceResend){
      var check = waWasSent(m.tanggal, m.nis, m.target, m.status, 'terlambat');
      if(check.sent){ alreadySent++; return; }
    }
    messages.push(m);
  });
  if(!messages.length){
    if(!options.silent) toast('✅ Semua ' + alreadySent + ' pesan sudah pernah terkirim.', 'inf');
    return { sent:0, failed:0, alreadySent:alreadySent, allDuplicate:true, total:allMessages.length };
  }
  var gb0 = waGerbang(messages.length);
  if(!gb0.ok){
    if(!options.silent) toast(gb0.msg, 'er');
    return { sent:0, failed:0, error:gb0.msg, pending:messages.length, alreadySent:alreadySent };
  }
  var tertunda = messages.length - gb0.boleh;
  if(tertunda > 0){
    messages = messages.slice(0, gb0.boleh);
    if(!options.silent) toast('Dibatasi '+gb0.boleh+' pesan (kuota harian). '+tertunda+' pesan belum dikirim — lanjutkan besok.', 'inf');
  }
  var st = await cekStatusGatewayWA();
  if(!st.ok){
    if(!options.silent) toast('Gateway WA: ' + st.msg, 'er');
    return { sent:0, failed:0, error:st.msg, pending:messages.length, alreadySent:alreadySent };
  }
  var delayMs = parseInt((ST.setting && ST.setting.waDelayMs) || '10000', 10);
  if(isNaN(delayMs) || delayMs < 10000) delayMs = 10000;
  var result = { sent:0, failed:0, total:messages.length, alreadySent:alreadySent, details:[] };
  var _gb = 0;
  for(var i=0; i<messages.length; i++){
    var m = messages[i]; var _s0 = result.sent;
    try{
      var res = await fetch(gatewayUrl + '/send', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ to:m.to, message:m.message })
      });
      if(res.ok){
        result.sent++;
        waMarkSent(m.tanggal, m.nis, m.target, m.status, m.to, { nama:m.nama }, 'terlambat');
        result.details.push({ ok:true, nis:m.nis, target:m.target });
      } else {
        var errTxt = await res.text();
        result.failed++;
        result.details.push({ ok:false, nis:m.nis, target:m.target, error:errTxt });
      }
    }catch(e){
      result.failed++;
      result.details.push({ ok:false, nis:m.nis, target:m.target, error:e.message });
    }
    if(result.sent > _s0){ waHariTambah(); _gb = 0; }
    else {
      _gb++;
      if(_gb >= waAturan().maxGagal){
        result.dihentikan = true;
        result.error = 'Pengiriman dihentikan otomatis karena ' + _gb + ' pesan gagal beruntun. Periksa gateway WhatsApp.';
        break;
      }
    }
    if(options.onProgress) options.onProgress(i+1, messages.length);
    if(i < messages.length-1) await new Promise(function(r){ setTimeout(r, waJedaMs(i, delayMs)); });
  }
  return result;
}

  });
  var pool = rows.length ? rows : (ST.cache.viewHadir || []);
  var targets = pool.filter(function(r){
    return String(r.Tanggal)===tgl && ['S','I','A'].indexOf(String(r.Status).toUpperCase())>=0;
  });
  if(!targets.length){
    toast('Mengambil data presensi ' + tgl + '…','inf');

async function jalankanKirimWAWithProgress(targets, tgl, opts){

function isHariLibur(dateStr){
  if(!dateStr) return false;
  var d = parseDate(dateStr);
  if(isNaN(d)) return false;
  var dow = d.getDay();
  if(dow === 0 || dow === 6) return true;
  if(HARI_LIBUR[dateStr]) return true;
  return false;
}
function labelHariLibur(dateStr){
  var d = parseDate(dateStr);
  var namaHari = gantiMingguKeAhad(d.toLocaleDateString('id-ID',{weekday:'long'}));
  if(HARI_LIBUR[dateStr]) return namaHari + ' — ' + HARI_LIBUR[dateStr];
  return 'Hari ' + namaHari;
}
function cekHariEfektif(dateStr){
  if(!dateStr) return { ok:false, msg:'Tanggal wajib diisi terlebih dahulu.' };
  if(isHariLibur(dateStr)){
    return { ok:false, msg:'🔒 Tidak dapat menyimpan data pada ' + labelHariLibur(dateStr) + '. Hari Sabtu, Ahad, dan libur nasional tidak dapat diisi kegiatan.' };
  }
  return { ok:true };
}
function shiftDate(dateStr, delta){
  var d = parseDate(dateStr);
  d.setDate(d.getDate() + delta);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function periodeGet(prefix){
  var mode = ST.cache['per_'+prefix+'_mode'] || 'bulan';
  var bulan = ST.cache['per_'+prefix+'_bulan'] || today().slice(0,7);
  var dari = ST.cache['per_'+prefix+'_dari'] || (bulan + '-01');
  var sampai = ST.cache['per_'+prefix+'_sampai'] || today();
  if(mode === 'bulan'){
    var parts = bulan.split('-');
    var yy = parseInt(parts[0],10), mm = parseInt(parts[1],10);
    if(!yy || !mm){ bulan = today().slice(0,7); parts = bulan.split('-'); yy = parseInt(parts[0],10); mm = parseInt(parts[1],10); }
    dari = bulan + '-01';
    sampai = bulan + '-' + pad2(new Date(yy, mm, 0).getDate());
  }
  if(dari > sampai){ var t = dari; dari = sampai; sampai = t; }
  var label;
  if(mode === 'bulan'){
    var pp = bulan.split('-');
    label = 'Bulan ' + monthName(parseInt(pp[1],10)) + ' ' + pp[0];
  } else {
    label = 'Rentang ' + tgl(dari) + ' s.d. ' + tgl(sampai);
  }
  return { mode:mode, bulan:bulan, dari:dari, sampai:sampai, label:label };
}
function periodeBarHTML(prefix){
  var p = periodeGet(prefix);
  var h = '<div class="fg" style="max-width:200px;flex:0 0 200px"><label>Mode Tampilan</label><select onchange="periodeSet(\''+prefix+'\',\'mode\',this.value)">'+
    '<option value="bulan"'+(p.mode==='bulan'?' selected':'')+'>📅 Bulanan</option>'+
    '<option value="rentang"'+(p.mode==='rentang'?' selected':'')+'>📆 Rentang Waktu</option></select></div>';
  if(p.mode === 'bulan'){
    h += '<div class="fg" style="max-width:200px"><label>Bulan</label><input type="month" value="'+esc(p.bulan)+'" onchange="periodeSet(\''+prefix+'\',\'bulan\',this.value)"></div>';
  } else {
    h += '<div class="fg"><label>Dari Tanggal</label><input type="date" value="'+esc(p.dari)+'" onchange="periodeSet(\''+prefix+'\',\'dari\',this.value)"></div>';
    h += '<div class="fg"><label>Sampai Tanggal</label><input type="date" value="'+esc(p.sampai)+'" onchange="periodeSet(\''+prefix+'\',\'sampai\',this.value)"></div>';
  }

function periodeSet(prefix, key, val){
  if(key === 'mode'){
    ST.cache['per_'+prefix+'_mode'] = val;
    var cur = periodeGet(prefix);
    if(val === 'rentang'){
      var pp = (cur.bulan || today().slice(0,7)).split('-');
      ST.cache['per_'+prefix+'_dari'] = cur.bulan + '-01';
      ST.cache['per_'+prefix+'_sampai'] = cur.bulan + '-' + pad2(new Date(parseInt(pp[0],10), parseInt(pp[1],10), 0).getDate());
    } else {
      ST.cache['per_'+prefix+'_bulan'] = String(cur.dari || today()).slice(0,7);
    }
  } else {
    ST.cache['per_'+prefix+'_'+key] = val;
    if(key === 'dari' || key === 'sampai') ST.cache['per_'+prefix+'_mode'] = 'rentang';
    if(key === 'bulan') ST.cache['per_'+prefix+'_mode'] = 'bulan';
  }
  if(prefix === 'jurnal') renderJurnal();
  else renderKegiatan(prefix);
}
function periodeReset(prefix){
  ST.cache['per_'+prefix+'_mode'] = 'bulan';
  ST.cache['per_'+prefix+'_bulan'] = today().slice(0,7);
  ST.cache['per_'+prefix+'_dari'] = today().slice(0,7) + '-01';
  ST.cache['per_'+prefix+'_sampai'] = today();
  if(prefix === 'jurnal') renderJurnal();
  else renderKegiatan(prefix);
}

}

function hitungPresensiKlasikal(tanggal, kelas){
  var rows = ST.cache.hadirKlasikal || [];
  if(!tanggal || !kelas) return {H:0,S:0,I:0,A:0,TH:0,total:0,hasData:false};
  var kelasArr = String(kelas||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  var filtered = rows.filter(function(r){
    if(String(r.Tanggal) !== String(tanggal)) return false;
    return kelasArr.indexOf(String(r.Kelas)) >= 0;
  });
  var H=0,S=0,I=0,A=0;
  filtered.forEach(function(r){
    if(r.Status === 'H') H++;
    else if(r.Status === 'S') S++;
    else if(r.Status === 'I') I++;
    else if(r.Status === 'A') A++;
  });
  return { H:H, S:S, I:I, A:A, TH:(S+I+A), total:(H+S+I+A), hasData: filtered.length > 0 };
}
/* Statistik klasikal: otomatis dari presensi; bila belum ada data presensi pakai isian manual */
function klasikalStat(r){
  var st = hitungPresensiKlasikal(r.Tanggal, r.Kelas);
  if(st.hasData) return { auto:true, siswa:st.total, masuk:st.H, tidak:st.TH, S:st.S, I:st.I, A:st.A };
  var siswa = (r.JumlahSiswa!=null && r.JumlahSiswa!=='') ? Number(r.JumlahSiswa) : null;
  var masuk = (r.JumlahHadir!=null && r.JumlahHadir!=='') ? Number(r.JumlahHadir) : null;
  var tidak = (siswa!=null && masuk!=null) ? Math.max(siswa-masuk,0) : null;
  return { auto:false, siswa:siswa, masuk:masuk, tidak:tidak, S:0, I:0, A:0 };
}
function klasikalTidakHadirList(tanggal, kelas){
  var rows = ST.cache.hadirKlasikal || [];
  var kelasArr = String(kelas||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  var NAMA = {S:'Sakit', I:'Izin', A:'Alpa'};
  return rows.filter(function(r){ return String(r.Tanggal)===String(tanggal) && kelasArr.indexOf(String(r.Kelas))>=0 && (r.Status==='S'||r.Status==='I'||r.Status==='A'); })
    .map(function(r){ return { Nama:r.Nama||r.NIS, Kelas:r.Kelas, Status:NAMA[r.Status]||r.Status, Keterangan:String(r.Keterangan||'').trim() }; })
    .sort(function(a,b){ return String(a.Nama).localeCompare(String(b.Nama),'id'); });
}
/* Siswa tidak masuk (jumlah + nama + status + keterangan) untuk cetak riwayat per kelas */
function klasikalTidakMasukHTML(r){
  var st = hitungPresensiKlasikal(r.Tanggal, r.Kelas);
  if(!st.hasData){
    var x = klasikalStat(r);
    if(x.tidak == null) return '-';
    return '<b>'+x.tidak+' siswa</b><div style="font-size:11px;color:#666">(isian manual; data presensi belum tersedia sehingga nama siswa tidak dapat ditampilkan)</div>';
  }
  if(!st.TH) return '<b>0 siswa</b> <span style="font-size:11px;color:#666">(semua siswa masuk)</span>';
  var list = klasikalTidakHadirList(r.Tanggal, r.Kelas);
  var h = '<b>'+st.TH+' siswa</b> <span style="font-size:11px;color:#666">(Sakit: '+st.S+' • Izin: '+st.I+' • Alpa: '+st.A+')</span>';
  h += '<ol style="margin:4px 0 0;padding-left:18px">'+list.map(function(x){
    return '<li>'+esc(x.Nama)+' — <b>'+esc(x.Status)+'</b>'+(x.Keterangan ? ', ket: '+esc(x.Keterangan) : ', ket: -')+'</li>';
  }).join('')+'</ol>';
  return h;
}
function ensureHadirKlasikal(tanggal){
  ST.cache._hkDates = ST.cache._hkDates || {};
  var have = (ST.cache.hadirKlasikal||[]).some(function(r){ return String(r.Tanggal)===String(tanggal); });
  if(have || ST.cache._hkDates[tanggal]) return Promise.resolve();
  ST.cache._hkDates[tanggal] = 1;
  return getHadirRowsRange(tanggal, tanggal).then(function(rows){
    var cur = ST.cache.hadirKlasikal || [];
    ST.cache.hadirKlasikal = cur.concat((rows||[]).filter(function(x){ return !cur.some(function(y){ return String(y.ID)===String(x.ID); }); }));
  }).catch(function(){});
}
function hitungPresensiKelompok(anggotaStr, tanggal){
  if(!anggotaStr || !tanggal) return {hadir:0,tidak:0,total:0,hasData:false};
  var list = String(anggotaStr||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  var nisList = list.map(function(x){ var idx = x.indexOf(' - '); return idx > 0 ? x.substring(0, idx).trim() : x.trim(); }).filter(Boolean);
  if(!nisList.length) return {hadir:0,tidak:0,total:0,hasData:false};
  var hadirRows = ST.cache.hadirKelompok || [];
  var map = {};
  hadirRows.forEach(function(r){
    if(String(r.Tanggal) !== String(tanggal)) return;
    if(nisList.indexOf(String(r.NIS)) >= 0) map[String(r.NIS)] = r.Status;
  });
  if(!Object.keys(map).length) return {hadir:0,tidak:0,total:nisList.length,hasData:false};
  var hadir = 0, tidak = 0;
  nisList.forEach(function(nis){
    var st = map[nis];
    if(st === 'H') hadir++;
    else if(st) tidak++;
  });
  return {hadir:hadir,tidak:tidak,total:nisList.length,hasData:true};
}
function formatAnggotaKelompok(anggotaStr){
  var list = String(anggotaStr||'').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
  return list.map(function(x){
    var idx = x.indexOf(' - ');
    var nis = idx > 0 ? x.substring(0, idx).trim() : x.trim();
    var nama = idx > 0 ? x.substring(idx + 3).trim() : '';
    var s = (ST.siswa||[]).find(function(s){ return String(s.NIS) === String(nis); });
    var kelas = s ? s.Kelas : '';
    return (nama || nis) + (kelas ? ' ('+kelas+')' : '');
  });
}

function getGoogleClientId(){ return (ST.setting && ST.setting.googleClientId) || DEFAULT_GOOGLE_CLIENT_ID || ''; }
function loadGoogleGIS(){
  if(window._gsiLoading) return window._gsiLoading;
  window._gsiLoading = new Promise(function(resolve, reject){
    if(window.google && window.google.accounts && window.google.accounts.oauth2){ resolve(window.google); return; }
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function(){
      if(window.google && window.google.accounts) resolve(window.google);
      else reject(new Error('Google Identity Services gagal dimuat'));
    };
    s.onerror = function(){ reject(new Error('Gagal memuat Google Identity Services. Cek koneksi internet.')); };
    document.head.appendChild(s);
  });
  return window._gsiLoading;
}
var _gTokenClient = null;
var _gTokenClientCid = '';
var _gAccessToken = null;
var _gTokenExpiry = 0;
var _gUserEmail = '';

async function googleSignIn(){
  var cid = getGoogleClientId();
  if(!cid){ throw new Error('Google Client ID belum diatur. Buka Setting → bagian Google Drive, isi Client ID lalu simpan.'); }
  await loadGoogleGIS();
  if(_gAccessToken && Date.now() < _gTokenExpiry - 60000) return _gAccessToken;
  if(!_gTokenClient || _gTokenClientCid !== cid){
    _gTokenClient = google.accounts.oauth2.initTokenClient({ client_id: cid, scope: GOOGLE_SCOPE, prompt: 'consent', callback: function(){} });
    _gTokenClientCid = cid;
  }
  return new Promise(function(resolve, reject){
    _gTokenClient.callback = function(resp){
      if(resp.error){ reject(new Error(resp.error_description || resp.error)); return; }
      _gAccessToken = resp.access_token;
      _gTokenExpiry = Date.now() + ((resp.expires_in || 3600) * 1000);
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + _gAccessToken } })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(info){ if(info && info.email) _gUserEmail = info.email; })
        .catch(function(){});
      resolve(_gAccessToken);
    };
    try{ _gTokenClient.requestAccessToken({ prompt: '' }); }
    catch(e){ reject(e); }
  });
}
async function gdEnsureFolder(token){
  var q = "mimeType='application/vnd.google-apps.folder' and name='"+GDRIVE_FOLDER_NAME+"' and 'appDataFolder' in parents and trashed=false";
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=' + encodeURIComponent(q);
  var r = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
  if(!r.ok) throw new Error('Gagal cek folder: ' + await r.text());
  var d = await r.json();
  if(d.files && d.files.length) return d.files[0].id;
  var body = { name:GDRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder', parents:['appDataFolder'] };
  var cr = await fetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method:'POST', headers:{ Authorization:'Bearer ' + token, 'Content-Type':'application/json' }, body: JSON.stringify(body)
  });
  if(!cr.ok) throw new Error('Gagal buat folder: ' + await cr.text());
  var cd = await cr.json();
  return cd.id;
}
async function gdUpload(filename, content){
  var token = await googleSignIn();
  var folderId = await gdEnsureFolder(token);
  var metadata = { name:filename, mimeType:'application/json', parents:[folderId] };
  var boundary = '-------' + Math.random().toString(36).slice(2);
  var delimiter = '\r\n--' + boundary + '\r\n';
  var closeDelim = '\r\n--' + boundary + '--';
  var body = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + delimiter + 'Content-Type: application/json\r\n\r\n' + content + closeDelim;
  var r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,createdTime', {
    method:'POST', headers:{ Authorization:'Bearer ' + token, 'Content-Type':'multipart/related; boundary="' + boundary + '"' }, body: body
  });
  if(!r.ok) throw new Error('Upload gagal: ' + await r.text());
  return await r.json();
}
async function gdList(){
  var token = await googleSignIn();
  var folderId = await gdEnsureFolder(token);
  var q = "'"+folderId+"' in parents and trashed=false";
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&orderBy=createdTime desc&pageSize=100&fields=files(id,name,size,createdTime)&q=' + encodeURIComponent(q);
  var r = await fetch(url, { headers:{ Authorization:'Bearer ' + token } });
  if(!r.ok) throw new Error('Gagal list: ' + await r.text());
  var d = await r.json();
  return d.files || [];
}
async function gdDownload(fileId){
  var token = await googleSignIn();
  var r = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', { headers:{ Authorization:'Bearer ' + token } });
  if(!r.ok) throw new Error('Gagal unduh: ' + await r.text());
  return await r.text();
}
async function gdDelete(fileId){
  var token = await googleSignIn();
  var r = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId, { method:'DELETE', headers:{ Authorization:'Bearer ' + token } });
  if(!r.ok && r.status !== 204) throw new Error('Gagal hapus: ' + await r.text());
}

function countBackupRows(data){
  var total = 0;
  Object.keys(data.stores || {}).forEach(function(k){ total += (data.stores[k] || []).length; });
  return total;
}

async function gdRestore(fileId, fileName){
  openModal('⚠️ Konfirmasi Restore dari Google Drive',

    '<label style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;margin-top:10px">'+
      '<input type="checkbox" id="gdRestoreConfirm" style="width:auto"> Ya, saya mengerti dan ingin melanjutkan restore</label>',
    '<button class="btn2" onclick="closeModal()">Batal</button>'+
    '<button class="btn3" id="gdRestoreBtn" disabled onclick="gdRestoreExecute(\''+fileId+'\',\''+esc(fileName).replace(/'/g,'')+'\')">⬇ Restore Sekarang</button>', true);
  var chk = document.getElementById('gdRestoreConfirm');
  var btn = document.getElementById('gdRestoreBtn');
  if(chk && btn) chk.onchange = function(){ btn.disabled = !chk.checked; };
}
async function gdRestoreExecute(fileId, fileName){
  closeModal();
  try{
    toast('Mengunduh file dari Google Drive…','inf');
    var txt = await gdDownload(fileId);
    var data = JSON.parse(txt);
    if(!data || !data.stores) throw new Error('Format backup tidak dikenali');
    try{
      toast('Membuat backup pengaman data saat ini…','inf');
      var safety = await buildBackupObject();
      var safetyName = 'AUTO_SAFETY_BEFORE_RESTORE_' + new Date().getTime() + '.json';
      await gdUpload(safetyName, JSON.stringify(safety, null, 2));
      toast('Backup pengaman tersimpan di Google Drive','inf');
    }catch(safeErr){ console.warn('Gagal backup pengaman:', safeErr); toast('Peringatan: gagal membuat backup pengaman, melanjutkan restore…','inf'); }
    var total = countBackupRows(data);
    toast('Memulihkan '+total+' data ke server…','inf');
    var res = await api('restoreAll', { backup: data });
    toast('✅ Restore berhasil — '+(res.total||total)+' data dipulihkan');
    setTimeout(function(){ location.reload(); }, 1600);
  }catch(e){ console.error(e); toast('Restore gagal: ' + e.message, 'er'); }
}
function pilihFileRestore(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){ if(inp.files[0]) restoreFromFile(inp.files[0]); };
  inp.click();
}
async function restoreFromFile(file){
  if(!file) return;
  if(!/\.json$/i.test(file.name||'')){ toast('File harus .json', 'er'); return; }
  var txt; try{ txt = await file.text(); }catch(e){ toast('Gagal baca file','er'); return; }
  var data; try{ data = JSON.parse(txt); }catch(e){ toast('File backup rusak','er'); return; }
  if(!data || !data.stores){ toast('Format backup tidak dikenali','er'); return; }
  await applyRestore(data);
}
async function applyRestore(data){
  var total = countBackupRows(data);
  return new Promise(function(resolve){
    confirmBox('Restore akan MENGGANTI seluruh data server dengan ' + total + ' data dari file backup. Lanjutkan?', async function(){
      try{
        var res = await api('restoreAll', { backup: data });
        toast('Restore berhasil — ' + (res.total||total) + ' data dipulihkan');
        setTimeout(function(){ location.reload(); }, 1200);
        resolve(true);
      }catch(e){ toast('Restore gagal: ' + e.message, 'er'); resolve(false); }
    });
  });
}

var ST = { token:null, user:null, guru:null, page:'dashboard',
  kelas:[], gurubk:[], gurupiket:[], siswa:[], setting:{}, cache:{}, history:[],
  cacheTTL:{}, khTab:'harian' };

var CACHE_TTL_MS = 30 * 60 * 1000;
function getCache(key, maxAgeMs){
  if(ST.cache[key] === undefined || ST.cache[key] === null) return null;
  var ts = ST.cacheTTL[key] || 0;
  if(Date.now() - ts > (maxAgeMs || CACHE_TTL_MS)) return null;
  return ST.cache[key];
}
function setCache(key, val){ ST.cache[key] = val; ST.cacheTTL[key] = Date.now(); }
function invalidateCache(key){ ST.cache[key] = null; ST.cacheTTL[key] = 0; }

var _hadirLoading = {};
function getHadirRowsRange(since, until, forceRefresh){
  var ck = 'HADIR|' + (since||'') + '|' + (until||'');
  if(forceRefresh){ ST.cache[ck] = null; ST.cacheTTL[ck] = 0; _hadirLoading[ck] = null; }
  var cached = getCache(ck);
  if(cached !== null) return Promise.resolve(cached);
  if(_hadirLoading[ck]) return _hadirLoading[ck];
  _hadirLoading[ck] = api('getData', { sheet: SH.HADIR, since: since, until: until })
    .then(function(rows){ setCache(ck, rows || []); _hadirLoading[ck] = null; return ST.cache[ck]; })
    .catch(function(e){ _hadirLoading[ck] = null; throw e; });
  return _hadirLoading[ck];
}
function getHadirRows(forceRefresh){
  var tglAkhir = today();
  var d = parseDate(tglAkhir); d.setDate(d.getDate() - 30);
  var tglAwal = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  return getHadirRowsRange(tglAwal, tglAkhir, forceRefresh);
}

function penangananSering(jenis, n){
  if(jenis === 'izin' || jenis === 'terlambat'){
    if(n >= 10) return 'Tier 4 | Kunjungan rumah + surat peringatan tertulis + koordinasi Wali Kelas & Kepala Sekolah untuk tindakan disiplin';
    if(n >= 7)  return 'Tier 3 | Wali Kelas memfasilitasi Pertemuan orang tua + konseling intensif Guru BK + surat peringatan tertulis';
    if(n >= 5)  return 'Tier 2 | Wali Kelas berkoordinasi dengan Guru BK + konseling individual + Pertemuan orang tua ke sekolah';
    if(n >= 3)  return 'Tier 1 | Wali Kelas memberi teguran lisan dan pembinaan; Guru BK memantau perkembangan';
    return 'Pemantauan rutin Wali Kelas';
  }
  return '-';
}
function penangananRawan(A, total){
  if(A >= 10) return 'Tier 4 | Kunjungan rumah + surat peringatan tertulis + koordinasi Wali Kelas & Kepala Sekolah';
  if(A >= 5)  return 'Tier 3 | Wali Kelas memfasilitasi Pertemuan orang tua + konseling intensif Guru BK + home visit';
  if(A >= 3)  return 'Tier 2 | Wali Kelas berkoordinasi dengan Guru BK + konseling individual + home visit awal';
  if(total >= 5) return 'Tier 1 | Wali Kelas melakukan pembinaan; Guru BK memantau perkembangan';
  return 'Pemantauan rutin Wali Kelas';
}
function tierBadge(txt, range){
  var m = String(txt||'').match(/^Tier\s*(\d)/i);
  if(!m) return '<span class="reko">'+esc(txt)+'</span>';
  var t = m[1];
  var rangeHTML = range ? ' <span class="tier-range">'+esc(range)+'</span>' : '';
  return '<span class="tier tier-'+t+'">Tier '+t+rangeHTML+'</span> <span class="reko">'+esc(txt.replace(/^Tier\s*\d\s*\|\s*/i,''))+'</span>';
}
function tierNumFromPenanganan(txt){ var m = String(txt||'').match(/^Tier\s*(\d)/i); return m ? +m[1] : 1; }
function rawanRowClass(tier){ var t = Math.max(1, Math.min(4, +tier || 1)); return 'rawan-t' + t; }
function tierRangeInfo(jenis, tier){
  var t = +tier;
  if(jenis === 'izin' || jenis === 'terlambat'){
    if(t === 1) return '(3–4×)'; if(t === 2) return '(5–6×)'; if(t === 3) return '(7–9×)'; if(t === 4) return '(≥10×)';
  } else if(jenis === 'kehadiran' || jenis === 'rawan'){
    if(t === 1) return '(total ≥5)'; if(t === 2) return '(Alpa 3–4)'; if(t === 3) return '(Alpa 5–9)'; if(t === 4) return '(Alpa ≥10)';
  }
  return '';
}
function sortByRawanSering(list, jenis){
  return list.slice().sort(function(a, b){
    var ta = tierNumFromPenanganan(penangananSering(jenis, a.n));
    var tb = tierNumFromPenanganan(penangananSering(jenis, b.n));
    if(tb !== ta) return tb - ta;
    if(b.n !== a.n) return b.n - a.n;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function sortByRawanKehadiran(list){
  return list.slice().sort(function(a, b){
    var totalA = (a.t != null ? a.t : a.total); var totalB = (b.t != null ? b.t : b.total);
    var ta = tierNumFromPenanganan(penangananRawan(a.A, totalA));
    var tb = tierNumFromPenanganan(penangananRawan(b.A, totalB));
    if(tb !== ta) return tb - ta;
    if(b.A !== a.A) return b.A - a.A;
    if(totalB !== totalA) return totalB - totalA;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function filterRawanByJenis(list, jenis){
  if(!jenis) return list;
  return list.filter(function(x){
    if(jenis === 'S') return (x.S||0) > 0;
    if(jenis === 'I') return (x.I||0) > 0;
    if(jenis === 'A') return (x.A||0) > 0;
    return true;
  });
}
function sortRawanByJenis(list, jenis){
  if(!jenis) return sortByRawanKehadiran(list);
  return list.slice().sort(function(a, b){
    var va = (jenis === 'S') ? (a.S||0) : (jenis === 'I') ? (a.I||0) : (a.A||0);
    var vb = (jenis === 'S') ? (b.S||0) : (jenis === 'I') ? (b.I||0) : (b.A||0);
    if(vb !== va) return vb - va;
    var ta = (a.t != null ? a.t : a.total) || 0; var tb = (b.t != null ? b.t : b.total) || 0;
    if(tb !== ta) return tb - ta;
    return String(a.Nama||'').localeCompare(String(b.Nama||''));
  });
}
function jenisLabelOf(jenis){
  if(jenis === 'S') return 'Sakit'; if(jenis === 'I') return 'Izin'; if(jenis === 'A') return 'Alpa';
  return 'Semua Ketidakhadiran';
}

function ttdIsDataURL(v){ return typeof v === 'string' && /^data:image\/(png|jpeg|jpg|webp);base64,/i.test(v); }
function ttdDataURLtoBlob(d){
  var m = d.match(/^data:([^;]+);base64,(.*)$/i);
  var bin = atob(m[2]), arr = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return { blob: new Blob([arr], { type: m[1] }), type: m[1] };
}
async function ttdNamaFile(d, ext){
  var id = '';
  try{
    if(window.crypto && crypto.subtle){
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(d));
      id = Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    }
  }catch(e){}
  if(!id) id = Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  return 'kegiatan/' + id + '.' + ext;
}
/* Unggah satu gambar data-URL ke bucket; kembalikan URL publik. Melempar error jika gagal. */
async function ttdUnggah(dataUrl){
  var sb = sbClient();
  var x = ttdDataURLtoBlob(dataUrl);
  var ext = x.type.indexOf('png') >= 0 ? 'png' : (x.type.indexOf('webp') >= 0 ? 'webp' : 'jpg');
  var path = await ttdNamaFile(dataUrl, ext);
  var up = await sb.storage.from(TTD_BUCKET).upload(path, x.blob, { contentType: x.type, upsert: true, cacheControl: '31536000' });
  if(up.error) throw up.error;
  var pu = sb.storage.from(TTD_BUCKET).getPublicUrl(path);
  if(!pu || !pu.data || !pu.data.publicUrl) throw new Error('URL publik tidak tersedia');
  return pu.data.publicUrl;
}
/* Dipanggil saat saveRecord/updateRecord: ganti field TTD berisi base64 dengan URL storage. */
async function ttdProsesRecord(sheet, obj){
  var fields = TTD_FIELDS[sheet]; if(!fields || !obj) return;
  for(var i = 0; i < fields.length; i++){
    var f = fields[i], v = obj[f];
    if(!ttdIsDataURL(v)) continue;
    try{
      obj[f] = await ttdUnggah(v);
    }catch(e){
      toast('⚠️ Tanda tangan disimpan di database karena gagal diunggah ke storage: ' + (e && e.message ? e.message : e) + '. Pastikan bucket "' + TTD_BUCKET + '" sudah dibuat.', 'er');
    }
  }
}

var TTD_URL_MARK = '/storage/v1/object/public/' + TTD_BUCKET + '/';
function ttdPathDariUrl(url){
  var u = String(url || ''), i = u.indexOf(TTD_URL_MARK);
  if(i < 0) return '';
  try{ return decodeURIComponent(u.substring(i + TTD_URL_MARK.length).split('?')[0]); }catch(e){ return ''; }
}
/* kumpulkan URL storage pada satu baris sebelum diubah/dihapus */
async function ttdUrlsRecord(sheet, id){
  var fields = TTD_FIELDS[sheet]; if(!fields) return [];
  try{
    var cols = fields.map(function(f){ return FIELD_MAP[sheet][f]; });
    var q = await sbClient().from(TABLES[sheet]).select(cols.join(',')).eq(pkOf(sheet), id).maybeSingle();
    if(q.error || !q.data) return [];
    var out = [];
    cols.forEach(function(c){ if(ttdPathDariUrl(q.data[c])) out.push(q.data[c]); });
    return out;
  }catch(e){ return []; }
}
/* apakah URL masih dipakai baris mana pun? (jika ragu, anggap masih dipakai) */
async function ttdMasihDipakai(url){
  var sb = sbClient();
  for(var i = 0; i < TTD_MIGRASI.length; i++){
    for(var j = 0; j < TTD_MIGRASI[i].kolom.length; j++){
      try{
        var q = await sb.from(TTD_MIGRASI[i].tabel).select('id').eq(TTD_MIGRASI[i].kolom[j], url).limit(1);
        if(q.error) return true;
        if(q.data && q.data.length) return true;
      }catch(e){ return true; }
    }
  }
  return false;
}
async function ttdBersihkan(urls){
  if(!urls || !urls.length) return;
  var seen = {}, hapus = [];
  for(var i = 0; i < urls.length; i++){
    var path = ttdPathDariUrl(urls[i]);
    if(!path || seen[path]) continue;
    seen[path] = true;
    if(!(await ttdMasihDipakai(urls[i]))) hapus.push(path);
  }
  if(!hapus.length) return;
  try{
    var r = await sbClient().storage.from(TTD_BUCKET).remove(hapus);
    if(r && r.error) console.warn('Gagal menghapus file tanda tangan:', r.error.message);
  }catch(e){ console.warn('Gagal menghapus file tanda tangan:', e); }
}

/* ---- pindai & hapus file yatim (file di storage yang tidak dirujuk data mana pun) ---- */
async function ttdPindaiYatim(){
  var sb = sbClient();
  var files = [], offset = 0, batch = 100;
  while(true){
    var l = await sb.storage.from(TTD_BUCKET).list('kegiatan', { limit: batch, offset: offset, sortBy: { column:'name', order:'asc' } });
    if(l.error) throw l.error;
    var items = l.data || [];
    items.forEach(function(it){ if(it && it.id) files.push(it); });
    if(items.length < batch) break;
    offset += batch;
  }
  var ref = {};
  for(var i = 0; i < TTD_MIGRASI.length; i++){
    for(var j = 0; j < TTD_MIGRASI[i].kolom.length; j++){
      var col = TTD_MIGRASI[i].kolom[j], from = 0, page = 1000;
      while(true){
        var q = await sb.from(TTD_MIGRASI[i].tabel).select(col).like(col, '%' + TTD_URL_MARK + '%').range(from, from + page - 1);
        if(q.error) throw q.error;
        (q.data || []).forEach(function(r){ var p = ttdPathDariUrl(r[col]); if(p) ref[p] = true; });
        if(!q.data || q.data.length < page) break;
        from += page;
      }
    }
  }
  var batasWaktu = Date.now() - 10 * 60 * 1000;  /* abaikan file < 10 menit (mungkin baru diunggah) */
  var yatim = [];
  files.forEach(function(f){
    var path = 'kegiatan/' + f.name;
    var t = Date.parse(f.created_at || f.updated_at || '') || 0;
    if(!ref[path] && t && t < batasWaktu) yatim.push({ path:path, size:(f.metadata && f.metadata.size) || 0 });
  });
  return { total: files.length, dirujuk: Object.keys(ref).length, yatim: yatim };
}

  openModal('Memindai File Tanda Tangan…', '<div id="orProg" style="font-size:13.5px;line-height:1.7">Memindai bucket dan database…</div>', '<button class="btn2" id="orClose" disabled>Tunggu…</button>');
  var out = document.getElementById('orProg'), foot = document.getElementById('orClose').parentNode;

}

/* ====== TAMPILAN REALTIME ======
   Berlangganan perubahan tabel Supabase (INSERT/UPDATE/DELETE). Setiap perubahan dari pengguna mana pun
   langsung memuat ulang data pada menu yang sedang dibuka. Bila Realtime belum aktif di Supabase,
   aplikasi otomatis memakai pembaruan berkala (polling) sebagai cadangan. */
var _rt = { ch:null, status:'', tables:{}, timer:null, poll:null, bound:false };
var RT_MASTER_TABLES = ['bk_siswa','bk_kelas','bk_gurubk','bk_gurupiket','bk_setting','bk_mutasi'];
function rtStart(){
  if(_rt.ch || !ST.user || ST.user.role === 'siswa') return;
  var sb; try{ sb = sbClient(); }catch(e){ return; }
  if(!_rt.bound){
    _rt.bound = true;
    document.addEventListener('visibilitychange', function(){
      if(document.hidden || !_rt.ch) return;
      _rt.tables['*'] = 1; rtJadwal(300);
    });
  }
  if(!sb.channel){ rtPollStart(); return; }
  try{
    var ch = sb.channel('bk-realtime');
    Object.keys(TABLES).forEach(function(sh){
      ch = ch.on('postgres_changes', { event:'*', schema:'public', table:TABLES[sh] }, function(p){
        rtOnChange((p && p.table) || TABLES[sh]);
      });
    });
    ch.subscribe(function(status){
      _rt.status = status;
      if(status === 'SUBSCRIBED') rtPollStop();
      else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') rtPollStart();
    });
    _rt.ch = ch;
    setTimeout(function(){ if(_rt.ch && _rt.status !== 'SUBSCRIBED') rtPollStart(); }, 8000);
  }catch(e){ console.error('[realtime]', e); rtPollStart(); _rt.ch = _rt.ch || {}; }
}
function rtStop(){
  try{ if(_rt.ch && _rt.ch.unsubscribe) sbClient().removeChannel(_rt.ch); }catch(e){}
  _rt.ch = null; _rt.status = ''; _rt.tables = {};
  clearTimeout(_rt.timer); rtPollStop();
}
function rtPollStart(){
  if(_rt.poll) return;
  _rt.poll = setInterval(function(){
    if(document.hidden || !ST.user) return;
    _rt.tables['*'] = 1; rtJadwal(0);
  }, 20000);
}
function rtPollStop(){ if(_rt.poll){ clearInterval(_rt.poll); _rt.poll = null; } }
function rtOnChange(table){ _rt.tables[table || '*'] = 1; rtJadwal(700); }
function rtJadwal(ms){ clearTimeout(_rt.timer); _rt.timer = setTimeout(rtFlush, ms); }
function rtSedangMengetik(){
  var a = document.activeElement; if(!a) return false;
  var tg = String(a.tagName||'').toLowerCase();
  if(tg === 'textarea') return true;
  if(tg === 'input') return ['text','search','number','tel','email','password','url'].indexOf(String(a.type||'text').toLowerCase()) >= 0;
  return false;
}
function rtFlush(){
  var names = Object.keys(_rt.tables);
  if(!names.length || !ST.user) return;
  if(document.hidden) return;                       /* ditunda sampai tab aktif kembali */
  var ov = document.getElementById('ov');
  if((ov && ov.classList.contains('on')) || rtSedangMengetik()){ rtJadwal(1500); return; }
  _rt.tables = {};
  var butuhMaster = false;
  var byTable = {}; Object.keys(TABLES).forEach(function(sh){ byTable[TABLES[sh]] = sh; });
  names.forEach(function(t){
    if(t === '*'){ return; }
    if(RT_MASTER_TABLES.indexOf(t) >= 0) butuhMaster = true;
    try{ invalidasiCacheSetelahTulis('saveRecord', { sheet: byTable[t] || t }); }catch(e){}
  });
  if(names.indexOf('*') >= 0){
    try{ invalidasiCacheSetelahTulis('saveRecord', {}); }catch(e){}
  }
  var lanjut = function(){ try{ rtRender(); }catch(e){ console.error('[realtime] render', e); } };
  if(butuhMaster){
    try{ localStorage.removeItem('bk_master'); }catch(e){}
    loadMaster(true).then(lanjut).catch(lanjut);
  } else lanjut();
}
function rtRender(){
  var p = ST.page;
  if(!p || ['setting','inputhp','laporanortu'].indexOf(p) >= 0) return;   /* halaman isian/pengaturan tidak dimuat ulang otomatis */
  if(KEG_CFG[p]){
    var mode = KEG_TABBED[p], tab = KEG_TAB[p] || 'daftar';
    if(!mode || tab === 'daftar'){ filterKegiatan(p, true); return; }
    if(mode === 'perkelas') pkLoadAll(p).then(function(){ pkInit(p); }).catch(function(){});
    else psLoadAll(p).then(function(){ psInit(p); }).catch(function(){});
    return;
  }
  go(p, true);
  if(p === 'rekapitulasi' && ST.cache.lpJenis) setTimeout(function(){ lpJenis(ST.cache.lpJenis); }, 30);
}
